<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-label="HousingCorner business card — front">
  <title>HousingCorner — business card (front) · 90×55 mm</title>

  <!-- Card background: warm cream -->
  <rect width="900" height="550" fill="#F5F0E6"/>

  <!-- Subtle terracotta corner accent (top-right) -->
  <path d="M 900 0 L 900 70 L 830 0 Z" fill="#C77E52" opacity="0.9"/>

  <!-- Icon (left side) -->
  <g transform="translate(50, 110) scale(1.2)">
    <path d="M 58 220 L 58 128 Q 58 120 64 114 L 124 56 Q 130 50 136 56 L 196 114 Q 202 120 202 128 L 202 220 Q 202 226 196 226 L 64 226 Q 58 226 58 220 Z" fill="#2F5D3A"/>
    <circle cx="130" cy="158" r="13" fill="#F5F0E6"/>
    <path d="M 118 168 Q 118 164 122 164 L 138 164 Q 142 164 142 168 L 142 220 L 118 220 Z" fill="#F5F0E6"/>
    <path d="M 130 64 Q 130 38 152 32 Q 150 52 138 60 Q 134 62 130 64 Z" fill="#8BA888"/>
    <path d="M 130 70 L 130 64" stroke="#8BA888" stroke-width="3" stroke-linecap="round"/>
    <path d="M 196 114 L 202 128 L 188 128 Z" fill="#C77E52"/>
  </g>

  <!-- Vertical rule -->
  <line x1="340" y1="140" x2="340" y2="410" stroke="#C77E52" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Wordmark + name block -->
  <text x="370" y="180"
        font-family="'Fraunces','Playfair Display',Georgia,serif"
        font-weight="500" font-size="52" fill="#1F2A24" letter-spacing="-1">HousingCorner</text>
  <text x="372" y="212"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="16" fill="#5C7A4F" letter-spacing="2.5">Your corner of property.</text>

  <!-- Founder name & title (use -ram or -rahul variants for personalised cards) -->
  <text x="370" y="292"
        font-family="'Fraunces',Georgia,serif"
        font-weight="500" font-size="30" fill="#1F2A24">Ram Kole &amp; Rahul Awale</text>
  <text x="372" y="320"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="15" fill="#8A7E6E" letter-spacing="1.5">CO-FOUNDERS · MAHARERA APPLICATION IN PROCESS</text>

  <!-- Contact block -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1F2A24">
    <text x="370" y="376">+91 84848 02019  ·  +91 95619 04097</text>
    <text x="370" y="400">info@housingcorner.in</text>
    <text x="370" y="424">www.housingcorner.in  ·  Latur, Maharashtra</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="520" width="900" height="30" fill="#2F5D3A"/>
  <text x="450" y="540" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="11" fill="#F5F0E6" letter-spacing="4">RESIDENTIAL · COMMERCIAL · CHANNEL PARTNER · MAHARASHTRA</text>
</svg>
