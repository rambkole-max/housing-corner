<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="HousingCorner Instagram post template">
  <title>HousingCorner — Instagram 1080×1080 template</title>

  <!-- Cream canvas -->
  <rect width="1080" height="1080" fill="#F5F0E6"/>

  <!-- Top forest green band with rounded bottom -->
  <path d="M 0 0 L 1080 0 L 1080 260 Q 540 360 0 260 Z" fill="#2F5D3A"/>

  <!-- Terracotta corner triangle top-right -->
  <path d="M 1080 0 L 1080 130 L 950 0 Z" fill="#C77E52"/>

  <!-- Cream icon centered in the green band -->
  <g transform="translate(440, 50) scale(0.8)">
    <path d="M 58 220 L 58 128 Q 58 120 64 114 L 124 56 Q 130 50 136 56 L 196 114 Q 202 120 202 128 L 202 220 Q 202 226 196 226 L 64 226 Q 58 226 58 220 Z" fill="#F5F0E6"/>
    <circle cx="130" cy="158" r="13" fill="#2F5D3A"/>
    <path d="M 118 168 Q 118 164 122 164 L 138 164 Q 142 164 142 168 L 142 220 L 118 220 Z" fill="#2F5D3A"/>
    <path d="M 130 64 Q 130 38 152 32 Q 150 52 138 60 Q 134 62 130 64 Z" fill="#8BA888"/>
    <path d="M 130 70 L 130 64" stroke="#8BA888" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Headline area (placeholder) -->
  <text x="540" y="520" text-anchor="middle"
        font-family="'Fraunces',Georgia,serif"
        font-weight="500" font-size="88" fill="#1F2A24" letter-spacing="-2">[Your headline]</text>
  <text x="540" y="600" text-anchor="middle"
        font-family="'Fraunces',Georgia,serif"
        font-weight="500" font-size="88" fill="#1F2A24" letter-spacing="-2">[goes here]</text>

  <!-- Sub-line -->
  <text x="540" y="700" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="30" fill="#5C7A4F" letter-spacing="1">[Supporting line — one short sentence]</text>

  <!-- Terracotta rule -->
  <line x1="440" y1="770" x2="640" y2="770" stroke="#C77E52" stroke-width="3" stroke-linecap="round"/>

  <!-- Brand footer -->
  <text x="540" y="960" text-anchor="middle"
        font-family="'Fraunces',Georgia,serif"
        font-weight="500" font-size="44" fill="#2F5D3A" letter-spacing="-1">HousingCorner</text>
  <text x="540" y="1000" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="18" fill="#8A7E6E" letter-spacing="4">YOUR CORNER OF PROPERTY  ·  @HOUSINGCORNER.IN</text>
</svg>
