<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-label="HousingCorner property photo watermark">
  <title>HousingCorner — property photo watermark (translucent corner stamp)</title>

  <!-- Soft cream pill for legibility over photos -->
  <rect width="400" height="140" rx="16" fill="#F5F0E6" fill-opacity="0.88"/>

  <!-- Tiny icon -->
  <g transform="translate(18, 22) scale(0.42)">
    <path d="M 58 220 L 58 128 Q 58 120 64 114 L 124 56 Q 130 50 136 56 L 196 114 Q 202 120 202 128 L 202 220 Q 202 226 196 226 L 64 226 Q 58 226 58 220 Z" fill="#2F5D3A"/>
    <circle cx="130" cy="158" r="13" fill="#F5F0E6"/>
    <path d="M 118 168 Q 118 164 122 164 L 138 164 Q 142 164 142 168 L 142 220 L 118 220 Z" fill="#F5F0E6"/>
    <path d="M 130 64 Q 130 38 152 32 Q 150 52 138 60 Q 134 62 130 64 Z" fill="#8BA888"/>
    <path d="M 196 114 L 202 128 L 188 128 Z" fill="#C77E52"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="62"
        font-family="'Fraunces','Playfair Display',Georgia,serif"
        font-weight="500" font-size="34" fill="#1F2A24" letter-spacing="-0.5">HousingCorner</text>
  <text x="132" y="88"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="13" fill="#5C7A4F" letter-spacing="2">Your corner of property.</text>

  <!-- URL line -->
  <text x="132" y="112"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="11" fill="#8A7E6E" letter-spacing="2.5">WWW.HOUSINGCORNER.IN  ·  RERA-REGISTERED INVENTORY ONLY</text>
</svg>
