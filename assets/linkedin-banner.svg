<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" role="img" aria-label="HousingCorner LinkedIn banner">
  <title>HousingCorner — LinkedIn banner (1584×396)</title>

  <!-- Two-tone split: cream left, forest green right -->
  <rect width="1584" height="396" fill="#F5F0E6"/>
  <rect x="950" width="634" height="396" fill="#2F5D3A"/>

  <!-- Terracotta vertical seam with a soft diagonal -->
  <path d="M 950 0 L 900 396 L 870 396 L 920 0 Z" fill="#C77E52"/>

  <!-- Left side: icon + wordmark -->
  <g transform="translate(90, 90) scale(0.8)">
    <path d="M 58 220 L 58 128 Q 58 120 64 114 L 124 56 Q 130 50 136 56 L 196 114 Q 202 120 202 128 L 202 220 Q 202 226 196 226 L 64 226 Q 58 226 58 220 Z" fill="#2F5D3A"/>
    <circle cx="130" cy="158" r="13" fill="#F5F0E6"/>
    <path d="M 118 168 Q 118 164 122 164 L 138 164 Q 142 164 142 168 L 142 220 L 118 220 Z" fill="#F5F0E6"/>
    <path d="M 130 64 Q 130 38 152 32 Q 150 52 138 60 Q 134 62 130 64 Z" fill="#8BA888"/>
    <path d="M 130 70 L 130 64" stroke="#8BA888" stroke-width="3" stroke-linecap="round"/>
    <path d="M 196 114 L 202 128 L 188 128 Z" fill="#C77E52"/>
  </g>

  <text x="290" y="180"
        font-family="'Fraunces','Playfair Display',Georgia,serif"
        font-weight="500" font-size="72" fill="#1F2A24" letter-spacing="-1.5">HousingCorner</text>
  <text x="292" y="226"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="22" fill="#5C7A4F" letter-spacing="2">Your corner of property.</text>
  <text x="292" y="280"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="16" fill="#8A7E6E" letter-spacing="1.5">Maharashtra's tech-forward real estate channel partner —</text>
  <text x="292" y="306"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="400" font-size="16" fill="#8A7E6E" letter-spacing="1.5">RERA-registered inventory. Honest advisory. Documented every step.</text>

  <!-- Right side: pull quote -->
  <g transform="translate(1040, 130)" fill="#F5F0E6" font-family="'Fraunces',Georgia,serif">
    <text x="0" y="0" font-size="44" font-weight="500" letter-spacing="-0.5">Find your corner</text>
    <text x="0" y="60" font-size="44" font-weight="500" letter-spacing="-0.5">of Maharashtra.</text>
    <text x="0" y="130" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8BA888" letter-spacing="3">RESIDENTIAL  ·  COMMERCIAL</text>
    <text x="0" y="160" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#F5F0E6" opacity="0.7" letter-spacing="1.5">housingcorner.in  ·  info@housingcorner.in</text>
  </g>
</svg>
