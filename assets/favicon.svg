<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="HousingCorner favicon">
  <title>HousingCorner — favicon (Rooted Corner mark)</title>

  <!--
    This is the real logo geometry from logos/housingcorner-icon.svg, not a
    redraw. The only deviation is an optical one: the keyhole doorway is a
    little larger and the leaf stem a little thicker than the master mark,
    because at 16px a hairline detail fills in and the house reads as a solid
    blob. Everything else — the rounded eaves, the leaf, the terracotta corner
    notch — is identical, so the tab icon and the letterhead are the same mark.
  -->

  <rect width="260" height="260" rx="32" fill="#F5F0E6"/>
  <g transform="translate(4,0)">
    <!-- house with softened eaves -->
    <path d="M 58 220 L 58 128 Q 58 120 64 114 L 124 56 Q 130 50 136 56 L 196 114 Q 202 120 202 128 L 202 220 Q 202 226 196 226 L 64 226 Q 58 226 58 220 Z" fill="#2F5D3A"/>
    <!-- keyhole doorway, optically enlarged for small sizes -->
    <circle cx="130" cy="156" r="15" fill="#F5F0E6"/>
    <path d="M 116 167 Q 116 162 121 162 L 139 162 Q 144 162 144 167 L 144 220 L 116 220 Z" fill="#F5F0E6"/>
    <!-- leaf sprouting from the roof peak -->
    <path d="M 130 64 Q 130 38 152 32 Q 150 52 138 60 Q 134 62 130 64 Z" fill="#8BA888"/>
    <path d="M 130 72 L 130 64" stroke="#8BA888" stroke-width="4" stroke-linecap="round"/>
    <!-- terracotta corner notch at the right eave -->
    <path d="M 196 114 L 202 128 L 188 128 Z" fill="#C77E52"/>
  </g>
</svg>
